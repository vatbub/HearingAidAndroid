import com.jsoniter.JsonIterator
import com.jsoniter.any.Any
import org.ajoberstar.grgit.Grgit

apply plugin: 'com.android.application'

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}
// Default to the Superpowered folder in the root project if not specified in local.properties
def superpowered_sdk_path = properties.getProperty('superpowered.dir') ?: "${rootProject.projectDir}/Superpowered"
// Ensure path uses forward slashes for CMake compatibility on Windows
superpowered_sdk_path = superpowered_sdk_path.replace('\\', '/')

private static int getCommitCountFromGitHub(String branch, int page) {
    try {
        URL url = new URL("https://api.github.com/repos/13-Clairvoyance/HearingAidAndroid-superpowered/commits?sha=" + branch + "&page=" + page)
        HttpURLConnection con = (HttpURLConnection) url.openConnection()
        con.setRequestMethod("GET")
        int status = con.getResponseCode()
        if (status != 200) {
            println "GitHub returned status " + status
            return -1
        }

        BufferedReader bufferedReader = new BufferedReader(
                new InputStreamReader(con.getInputStream()))
        String inputLine
        StringBuffer content = new StringBuffer()
        while ((inputLine = bufferedReader.readLine()) != null) {
            content.append(inputLine)
        }
        bufferedReader.close()

        Any commits = JsonIterator.deserialize(content.toString())
        return commits.size()
    } catch (Exception e) {
        println "Error getting commit count from GitHub: " + e.message
        return -1
    }
}

ext {
    int gitHubCommitCount = 0
    int localCommitCount = 0
    try {
        // Open the Git repository in the current directory.
        def git = Grgit.open(dir: file('..'))

        int page = 1
        int lastResCount = -1
        while (lastResCount != 0) {
            lastResCount = getCommitCountFromGitHub(git.branch.current.name, page)
            page++
            if (lastResCount == -1) {
                println "Unable to get commit count from github, using local repo"
                gitHubCommitCount = 0
                break
            }
            gitHubCommitCount = gitHubCommitCount + lastResCount
        }
        localCommitCount = git.log(includes: ['HEAD']).size()
    } catch (Exception e) {
        println "Git not available: " + e.message
    }

    println "GitHub returned " + gitHubCommitCount + " commits"
    GIT_COMMIT_COUNT = Math.max(localCommitCount, gitHubCommitCount)
    if (GIT_COMMIT_COUNT <= 0) GIT_COMMIT_COUNT = 1
}

android {
    namespace 'com.github.vatbub.hearingaid'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.github.vatbub.hearingaid"
        minSdk 24
        targetSdk 34
        versionCode GIT_COMMIT_COUNT
        versionName "1.0." + new Date().format('yyyy_MM_dd_HHmm')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // bugSnagApiKey placeholder is no longer needed since plugin is removed
        manifestPlaceholders = [bugSnagApiKey: "not_specified"]

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE", "-DPATH_TO_SUPERPOWERED:STRING=${superpowered_sdk_path}"
                cFlags "-O3", "-fsigned-char"
                cppFlags "-fsigned-char", "-I${superpowered_sdk_path}"
            }
        }
    }

    buildFeatures {
        renderScript true
        aidl true
        buildConfig true
    }

    lint {
        disable 'InvalidPackage'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jni']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
            enableUnitTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/kotlin-stdlib-jdk7.kotlin_module', 'META-INF/kotlin-stdlib-jdk8.kotlin_module']
        }
        jniLibs {
            useLegacyPackaging false
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.10'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
    
    implementation('com.google.guava:guava:32.1.2-android') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    implementation 'com.amazonaws:aws-android-sdk-s3:2.7.7'
    implementation 'com.github.apl-devs:appintro:v4.2.2'
    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:0.7.2'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
    implementation 'ru.noties:markwon:1.0.3'
    implementation 'androidx.cardview:cardview:1.0.0'
}
